# Rebuilds the daily snapshot the API serves from.
#
# Runs on GitHub's free tier (unlimited minutes for public repos). It downloads
# ~1.2 MB of free bulk box scores, runs the model for every player, and
# publishes one SQLite file as a Release asset.
#
# The snapshot is published as a release asset rather than committed because a
# ~9 MB binary committed daily would add several GB of git history per year.

name: Refresh data snapshot

on:
  schedule:
    # 06:30 UTC — after sportsdataverse publishes its daily update (~05:00 UTC).
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Pinned to the serving runtime so the model pickle round-trips.
          python-version: "3.9"
          cache: pip

      - name: Install data-job dependencies
        run: pip install -r backend/requirements-data.txt

      - name: Build snapshot
        working-directory: backend
        run: python scripts/build_snapshot.py --out data/snapshot.db

      - name: Publish snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # `create ... || true` so the first run makes the release and later
          # runs just replace the asset on it.
          gh release create data-snapshot \
            --title "Daily data snapshot" \
            --notes "Rebuilt automatically. See .github/workflows/refresh-data.yml" \
            || true
          gh release upload data-snapshot backend/data/snapshot.db --clobber

      - name: Commit id map and archive today's injury report
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # The id map is small and text; committing it makes ID churn reviewable.
          # The injury archive is the whole point of this step: ESPN keeps no
          # history, so unless each day's report is committed the moment it is
          # fetched, it is gone. Without it the TEAM_MIN_ABSENT feature can never
          # be validated against production conditions.
          git add backend/data/id_map.json backend/data/injuries/

          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "chore: refresh id map and archive injury report ($(date -u +%Y-%m-%d))"
            # Another run may have pushed since checkout; rebase rather than fail.
            git pull --rebase --autostash origin main
            git push
          fi
